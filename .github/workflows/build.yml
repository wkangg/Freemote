name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to Decrypted IPA file"
        type: string
        required: true
      create_release:
        description: "Create draft release"
        default: false
        type: boolean

# Read-only unless a job needs more, so the token doesn't depend on the repo's default
permissions:
  contents: read

jobs:
  deb:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: deb-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Get package info
        id: package_info
        run: |
          echo "id=$(grep "^Package:" control | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Theos cache key
        run: echo "theos_heads=$(git ls-remote https://github.com/theos/theos HEAD | cut -f 1)-$(git ls-remote https://github.com/theos/sdks HEAD | cut -f 1)" >> $GITHUB_ENV

      - name: Cache theos
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.theos_heads }}

      - name: Setup theos
        uses: Randomblock1/theos-action@v1

      - name: Build rootless deb
        run: make package
        env:
          FINALPACKAGE: 1
          THEOS_PACKAGE_SCHEME: rootless

      - name: Build rootful deb
        run: make clean package
        env:
          FINALPACKAGE: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package_info.outputs.id }}_${{ steps.package_info.outputs.commit }}
          path: packages/*.deb
          if-no-files-found: error

  ipa:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      # Create release
      contents: write

    steps:
      # This job's token can write, and it runs theos-jailed's install script, so the checkouts don't leave the token in
      # git config. Nothing here pushes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get package info
        id: package_info
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          # theos-jailed needs plistutil from libplist >= 2.3 for the OpenStep-format Substrate
          # Info.plist; 24.04 ships 2.3.0 (22.04's 2.2.0 fails on it and still exits 0)
          sudo apt install -y rsync llvm xmlstarlet libplist-utils

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "::add-mask::$IPA_URL"
          # Some file hosts (e.g. catbox) drop long transfers; resume until the file is complete
          for attempt in $(seq 1 3); do
            curl -fL -C - --retry 5 --retry-all-errors --retry-delay 3 \
              -o "${{ github.workspace }}/App.ipa" "$IPA_URL" && break
            echo "Download interrupted (attempt $attempt), resuming..."
            sleep 3
          done
          zip -T "${{ github.workspace }}/App.ipa"

      - name: Get IPA Info
        id: ipa_info
        run: |
          info=$(unzip -p "${{ github.workspace }}/App.ipa" Payload/*.app/Info.plist)
          # The IPA is untrusted: only version characters are kept, so the version can't add lines to the outputs or move
          # the renamed IPA out of packages/
          echo "version=$(echo $info | xmlstarlet sel -t -v "/plist/dict/key[text()=\"CFBundleShortVersionString\"]/following-sibling::*[1]/text()" | tr -cd '0-9A-Za-z._-')" >> $GITHUB_OUTPUT

      - name: Theos cache key
        run: echo "theos_heads=$(git ls-remote https://github.com/theos/theos HEAD | cut -f 1)-$(git ls-remote https://github.com/theos/sdks HEAD | cut -f 1)" >> $GITHUB_ENV

      - name: Cache theos
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.theos_heads }}

      - name: Setup theos
        uses: Randomblock1/theos-action@v1

      - name: Checkout theos-jailed
        uses: actions/checkout@v7
        with:
          repository: level3tjg/theos-jailed
          path: theos-jailed
          submodules: recursive
          persist-credentials: false

      - name: Install theos-jailed
        run: |
          ./theos-jailed/install
          # Remove plistutil again so Theos leaves resource plists as XML, as before
          sudo dpkg -r libplist-utils

      - name: Build IPA
        run: make package
        env:
          FINALPACKAGE: 1
          SIDELOADED: 1
          # theos-jailed defaults to zip -9 for final packages, which is slow on a large IPA
          COMPRESSION: 6
          IPA: ${{ github.workspace }}/App.ipa

      - name: Rename IPA
        id: ipa_name
        env:
          APP_VERSION: ${{ steps.ipa_info.outputs.version }}
          COMMIT: ${{ steps.package_info.outputs.commit }}
        run: |
          # The version comes from the downloaded IPA, so it's passed in rather than pasted into the script
          # e.g. Freemote_32.1-eab3452, rather than the package ID
          name="$(grep "^Name:" control | cut -d' ' -f2)_${APP_VERSION}-${COMMIT}"
          mv -f packages/*.ipa "packages/$name.ipa"
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ipa_name.outputs.name }}
          path: packages/*.ipa
          if-no-files-found: error

      - name: Create release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: packages/*.ipa
          tag_name: v${{ steps.ipa_info.outputs.version }}-${{ steps.package_info.outputs.commit }}
